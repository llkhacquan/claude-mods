<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="880" height="400" rx="12" fill="#f8fafc"/>

  <text x="24" y="34" font-size="15" font-weight="600" fill="#111827">How a question travels</text>

  <rect x="24" y="52" width="230" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="38" y="76" font-weight="600" fill="#111827">1. Claude calls the ask tool</text>
  <text x="38" y="96" fill="#475569">text, options, notes, lean</text>

  <rect x="24" y="140" width="230" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="38" y="164" font-weight="600" fill="#111827">2. Board file + card</text>
  <text x="38" y="184" fill="#475569">~/.local/state/qboard/&lt;id&gt;.json</text>

  <rect x="24" y="228" width="230" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="38" y="252" font-weight="600" fill="#111827">3. You answer</text>
  <text x="38" y="272" fill="#475569">click, Enter in the box, or "Q3 2"</text>

  <rect x="24" y="316" width="230" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="38" y="340" font-weight="600" fill="#111827">4. Prompt + context note</text>
  <text x="38" y="360" fill="#475569">qboard: Q3 answered: option 2</text>

  <line x1="139" y1="116" x2="139" y2="138" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="139" y1="204" x2="139" y2="226" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="139" y1="292" x2="139" y2="314" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="256" y1="172" x2="300" y2="172" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="262" y="164" font-size="11" fill="#6b7280">draws</text>

  <text x="304" y="34" font-size="15" font-weight="600" fill="#111827">The pane (terminal look; the desktop app draws the same cards)</text>
  <rect x="304" y="52" width="552" height="328" rx="10" fill="#0f172a"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <text x="320" y="78" fill="#e5e7eb" font-weight="700">qboard</text>
    <text x="380" y="78" fill="#e0a526" font-weight="700">2 open</text>
    <text x="772" y="78" fill="#e5e7eb">send now</text>

    <rect x="320" y="92" width="520" height="168" rx="8" fill="none" stroke="#e0a526"/>
    <rect x="332" y="104" width="34" height="20" fill="#e0a526"/>
    <text x="337" y="119" fill="#0f172a" font-weight="700">Q3</text>
    <text x="376" y="119" fill="#e5e7eb" font-weight="700">Which layout for the pane?</text>
    <text x="808" y="119" fill="#94a3b8">2m</text>
    <text x="344" y="146" fill="#e5e7eb">Q3.1 dock right</text>
    <text x="376" y="164" fill="#94a3b8">keeps the transcript wide</text>
    <text x="332" y="188" fill="#e0a526" font-weight="700">*</text>
    <text x="344" y="188" fill="#e5e7eb">Q3.2 float</text>
    <text x="440" y="188" fill="#94a3b8">(lean)</text>
    <text x="332" y="212" fill="#6fa8dc">[explain more]</text>
    <rect x="332" y="222" width="420" height="26" rx="4" fill="#1e293b"/>
    <text x="342" y="240" fill="#64748b">answer (Enter), or a question ([ask])</text>
    <text x="772" y="240" fill="#6fa8dc">[ask]</text>

    <rect x="320" y="272" width="520" height="52" rx="8" fill="none" stroke="#475569"/>
    <rect x="332" y="284" width="34" height="20" fill="#e0a526"/>
    <text x="337" y="299" fill="#0f172a" font-weight="700">Q4</text>
    <text x="376" y="299" fill="#e5e7eb" font-weight="700">Keep the old flag?</text>
    <text x="808" y="299" fill="#94a3b8">1m</text>

    <text x="320" y="346" fill="#94a3b8">&gt; Answered and closed (2)</text>
    <text x="320" y="368" fill="#64748b">ctrl+x tab focus  1-9 answer Q3  d done</text>
  </g>
</svg>
